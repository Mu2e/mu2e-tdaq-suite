notes:
  routing: >
    Staged with "file this against Mu2e/mu2edaq-main": the repository's own
    purpose is documented (CMakeLists.txt:1), and the open decision is the
    superproject's .gitmodules entry. The fingerprint uses Mu2e/mu2edaq-main.
  spack_mpd: >
    The Spack package mu2e-tdaq-suite is a BundlePackage in Mu2e/mu2e-spack
    (packages/mu2e-tdaq-suite/package.py, default branch artdaq/Spack0.28)
    with versions v4_00_00..v15_00_00 and develop, pinning art-suite,
    artdaq, otsdaq-suite and the Mu2e TDAQ packages per version. It is
    installed by spack add mu2e-tdaq-suite@tag
    (otsdaq-mu2e/tools/mu2e-quick-spack-start_v1.1.sh:287). In --develop
    --all-packages mode that script clones this repository into srcs/ (:319)
    for Spack MPD, which needs a CMakeLists.txt in every srcs/ entry. Same
    pattern as art-daq/artdaq-suite and art-daq/otsdaq-suite.
  license: >
    LICENSE is the Fermilab BSD text; GitHub's licence detection reports
    "Other".
  pin: >
    mu2edaq-main HEAD and t01.00.00 pin 997faeb (2026-02-16); upstream
    develop is at 7deabce (2026-09-30, README link update), 2 commits ahead.
  loc: >
    1 line of CMake (a comment). README.md 24 lines of links.
